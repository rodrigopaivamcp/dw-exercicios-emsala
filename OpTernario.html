<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Ternario</title>
</head>
<body>
    <script language="javascript">
        // OBJETIVO: Utilizar o operador ternario ? e :*/

        // DEFINIÇÃO DA VARIÁVEL
        var js_num = 30;

        // APLICAÇÃO DO OPERADOR TERNÁRIO
        
        document.write('<p>js_num <b>==</b> 20 <b>?</b> "SIM" <b>:</b> "NÃO" = RESPOSTA=> ');
            ((js_num==20) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
        
        document.write('<p>js_num <b>!=</b> 20 <b>?</b> "SIM" <b>:</b> "NÃO" = RESPOSTA=> ');
            ((js_num!=20) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
        
        document.write('<p>js_num <b></b> 50 <b>?</b> "SIM" <b>:</b> "NÃO" = RESPOSTA=> ');
            ((js_num<50) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));
            
        document.write('<p>js_num <b>-20</b> == 0 <b>?</b> "SIM" <b>:</b> "NÃO" = RESPOSTA=> ');
            ((js_num - 20 == 0) ? document.write('<b>SIM</b>') : document.write('<b>NÃO</b>'));


    </script>
    
</body>
</html>
