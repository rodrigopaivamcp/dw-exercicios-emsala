<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura WHILE</title>
</head>
<body>
    <script type="text/javascript">
        // OBJETIVO: Escrever uma mensagem limitando em 10 vezes através de um contador que será incrementado em +1

        // DEFINIÇÃO DAS VARIÁVEIS 
        var js_contador=1;

        // LAÇO DE REPETIÇÃO WHILE
        while(js_contador <= 10){
            document.write('<p>'+js_contador+ 'Repetição de uma única linha de comando dentro de um laço de repetição: ');
                js_contador+=1;
        }

    </script>
</body>
</html>
