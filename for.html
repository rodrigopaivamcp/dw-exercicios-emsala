<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laço For</title>
</head>
<body>
    <script type="text/javascript">
        // OBJETIVO: Aplicação do laço de repetição FOR, incrementando + 2
        // na variável js_num e apresentnado os valores acumulados de 1 a 10.

        // DEFINIÇÃO DE VARIÁVEIS
        var js_num;

        document.write('<p>Apresentação dos valores acumulados para js_num e menor ou igual a 10 incrementando a variável de +=2:');

            // APLICAÇÃO DO LAÇO FOR 
            for(js_num=1; js_num<=10;js_num+=2){
                document.write('<p>'+js_num);
            }


    </script>
    
</body>
</html>
